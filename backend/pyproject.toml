[project]
name = "uanji-core-backend"
version = "0.1.0"
description = "Backend local do UANJI CORE"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "keyring>=25",
  "httpx>=0.27",
  "tzdata>=2024.1",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
assistant = ["anthropic>=2.0"]
# Voz local: reconhecimento (Vosk), microfone (PortAudio) e permissões/vozes do macOS.
voice = ["vosk>=0.3.44", "sounddevice>=0.5", "pyobjc-framework-AVFoundation>=10"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "pyinstaller>=6.11"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Expressões regulares de linguagem natural: mais legíveis numa só linha.
"uanji/assistant/intents.py" = ["E501"]
# Frases faladas pelo assistente e listas de nomes de aplicações: mais legíveis numa só linha.
"uanji/assistant/proactive.py" = ["E501"]
"uanji/activity/monitor.py" = ["E501"]
# Auto-teste: token fictício de uma instância temporária.
"uanji/voice/selftest.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uanji*"]
